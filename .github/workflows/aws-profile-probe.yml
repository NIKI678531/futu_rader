name: AWS Profile Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure organization AWS profiles
        shell: bash
        env:
          AWS_CREDENTIALS_CONTENT: ${{ secrets.AWS_CREDENTIALS }}
          AWS_CONFIG_CONTENT: ${{ secrets.AWS_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$AWS_CREDENTIALS_CONTENT"
          test -n "$AWS_CONFIG_CONTENT"
          install -d -m 700 "$HOME/.aws"
          printf '%s\n' "$AWS_CREDENTIALS_CONTENT" > "$HOME/.aws/credentials"
          printf '%s\n' "$AWS_CONFIG_CONTENT" > "$HOME/.aws/config"
          chmod 600 "$HOME/.aws/credentials" "$HOME/.aws/config"

      - name: Probe required profiles and resources
        shell: bash
        env:
          AWS_REGION: ap-east-1
          UAT_CLUSTER: hkg-csop-aws-uat-vpc02-eks004-ahmiao
          PRD_CLUSTER: hkg-csop-aws-prd-vpc02-eks004-ahmiao
          UAT_BASE_URL: https://amao-uat.csopasset.com/remote/opinion-radar
        run: |
          set -uo pipefail
          profiles="$(aws configure list-profiles)"
          printf '%s\n' "$profiles" | sort | sed 's/^/profile=/'

          for profile in ecr_uat eks_uat ecr_prd eks_prd; do
            if printf '%s\n' "$profiles" | grep -qx "$profile"; then
              if AWS_PROFILE="$profile" aws sts get-caller-identity >/dev/null; then
                echo "$profile=authenticated"
              else
                echo "$profile=authentication-failed"
              fi
            else
              echo "$profile=missing"
            fi
          done

          AWS_PROFILE=eks_uat aws eks describe-cluster \
            --region "$AWS_REGION" --name "$UAT_CLUSTER" \
            --query 'cluster.status' --output text || true
          AWS_PROFILE=eks_prd aws eks describe-cluster \
            --region "$AWS_REGION" --name "$PRD_CLUSTER" \
            --query 'cluster.status' --output text || true

          AWS_PROFILE=eks_uat aws eks update-kubeconfig \
            --region "$AWS_REGION" --name "$UAT_CLUSTER" >/dev/null
          if kubectl --request-timeout=15s auth can-i patch deployments -n ih | grep -qx yes; then
            echo "uat_kubernetes=patch-authorized"
          else
            echo "uat_kubernetes=unavailable-or-unauthorized"
          fi
          for deployment in \
            ih-uat-remote-opinion-radar-srvapp \
            ih-uat-remote-opinion-radar-worker \
            ih-uat-remote-opinion-radar-webapp; do
            if kubectl --request-timeout=15s -n ih get "deployment/$deployment" >/dev/null 2>&1; then
              echo "deployment:$deployment=present"
            else
              echo "deployment:$deployment=unavailable"
            fi
          done

          for profile in ecr_uat eks_uat; do
            if printf '%s\n' "$profiles" | grep -qx "$profile"; then
              for repository in \
                ih-uat-remote-opinion-radar-srvapp \
                ih-uat-remote-opinion-radar-webapp; do
                if AWS_PROFILE="$profile" aws ecr describe-repositories \
                  --region "$AWS_REGION" --repository-names "$repository" >/dev/null 2>&1; then
                  echo "$profile:$repository=readable"
                else
                  echo "$profile:$repository=unavailable"
                fi
              done
            fi
          done

          if curl --fail --silent --show-error --location --max-time 30 "$UAT_BASE_URL" >/dev/null; then
            echo "uat_url=reachable"
          else
            echo "uat_url=unreachable"
          fi
