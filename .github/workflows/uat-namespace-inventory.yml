name: Temporary UAT Namespace Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Configure UAT Kubernetes access
        shell: bash
        env:
          AWS_CREDENTIALS_CONTENT: ${{ secrets.AWS_CREDENTIALS }}
          AWS_CONFIG_CONTENT: ${{ secrets.AWS_CONFIG }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-east-1' }}
          EKS_CLUSTER_NAME: ${{ vars.UAT_EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.aws"
          printf '%s\n' "$AWS_CREDENTIALS_CONTENT" > "$HOME/.aws/credentials"
          printf '%s\n' "$AWS_CONFIG_CONTENT" > "$HOME/.aws/config"
          chmod 600 "$HOME/.aws/credentials" "$HOME/.aws/config"
          AWS_PROFILE=eks_uat aws eks update-kubeconfig \
            --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" >/dev/null

      - name: List UAT namespaces and matching workloads
        shell: bash
        run: |
          set -euo pipefail
          echo "namespaces:"
          kubectl get namespaces \
            -o custom-columns='NAME:.metadata.name,STATUS:.status.phase' --no-headers
          echo "matching workloads:"
          kubectl get deployments,services,ingresses -A \
            -o custom-columns='NAMESPACE:.metadata.namespace,KIND:.kind,NAME:.metadata.name' \
            --no-headers | grep -Ei 'ih|opinion|radar' || true
          echo "can_create_namespace=$(kubectl auth can-i create namespaces)"
