name: AWS Kubernetes Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure organization AWS profiles
        shell: bash
        env:
          AWS_CREDENTIALS_CONTENT: ${{ secrets.AWS_CREDENTIALS }}
          AWS_CONFIG_CONTENT: ${{ secrets.AWS_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$AWS_CREDENTIALS_CONTENT"
          test -n "$AWS_CONFIG_CONTENT"
          install -d -m 700 "$HOME/.aws"
          printf '%s\n' "$AWS_CREDENTIALS_CONTENT" > "$HOME/.aws/credentials"
          printf '%s\n' "$AWS_CONFIG_CONTENT" > "$HOME/.aws/config"
          chmod 600 "$HOME/.aws/credentials" "$HOME/.aws/config"

      - name: Probe UAT permissions and shared ingress
        shell: bash
        run: |
          set -euo pipefail
          AWS_PROFILE=eks_uat aws eks update-kubeconfig \
            --region ap-east-1 --name hkg-csop-aws-uat-vpc02-eks004-ahmiao >/dev/null
          for permission in \
            'create jobs.batch' \
            'delete jobs.batch' \
            'get pods' \
            'get pods/log' \
            'create pods/exec' \
            'create configmaps' \
            'create secrets' \
            'create services' \
            'create deployments.apps'; do
            verb="${permission%% *}"
            resource="${permission#* }"
            result="$(kubectl auth can-i "$verb" "$resource" -n ih)"
            echo "uat_can_${verb}_${resource//\//-}=$result"
          done
          kubectl -n ih get ingress -o json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for item in data.get("items", []):
              name = item.get("metadata", {}).get("name", "")
              hosts = sorted({rule.get("host") or "<all>" for rule in item.get("spec", {}).get("rules", [])})
              print("uat_ingress={};hosts={}".format(name, ",".join(hosts)))
          '

      - name: Probe PRD runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          AWS_PROFILE=eks_prd aws eks update-kubeconfig \
            --region ap-east-1 --name hkg-csop-aws-prd-vpc02-eks004-ahmiao >/dev/null
          echo "prd_patch_deployments=$(kubectl auth can-i patch deployments -n ih)"
          for kind in deployment configmap secret service ingress; do
            matches="$(kubectl -n ih get "$kind" -o name | grep -E 'opinion|radar' || true)"
            if [ -n "$matches" ]; then
              printf 'prd_%s=%s\n' "$kind" "$(printf '%s' "$matches" | paste -sd, -)"
            else
              echo "prd_${kind}=none"
            fi
          done
