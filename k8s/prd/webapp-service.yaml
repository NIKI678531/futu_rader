apiVersion: v1
kind: Service
metadata:
  name: ih-prd-remote-opinion-radar-webapp
  namespace: ih
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  labels:
    app: ih-prd-remote-opinion-radar
    component: webapp
    env: prd
spec:
  type: ClusterIP
  selector:
    app: ih-prd-remote-opinion-radar
    component: webapp
  ports:
    - name: http
      port: 3026
      targetPort: http
      protocol: TCP