apiVersion: v1
kind: Service
metadata:
  name: futuradar-webapp
  namespace: futu-radar
  labels:
    app: prd-futuradar
    component: webapp
    env: prd
spec:
  type: ClusterIP
  selector:
    app: prd-futuradar
    component: webapp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP