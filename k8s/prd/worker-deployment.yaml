apiVersion: apps/v1
kind: Deployment
metadata:
  name: ih-prd-remote-opinion-radar-worker
  namespace: ih
  labels:
    app: ih-prd-remote-opinion-radar
    component: worker
    env: prd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ih-prd-remote-opinion-radar
      component: worker
  template:
    metadata:
      labels:
        app: ih-prd-remote-opinion-radar
        component: worker
        env: prd
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 900
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-opinion-radar-srvapp:latest
          imagePullPolicy: Always
          workingDir: /app/worker
          command: [/usr/bin/tini, --, /opt/worker/bin/python, /app/deploy/runtime.py, worker]
          args: [/opt/worker/bin/python, -m, alembic, -c, /app/radar_db/alembic.ini, upgrade, head]
          env:
            - name: PATH
              value: /opt/worker/bin:/opt/srvapp/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
          envFrom:
            - configMapRef:
                name: ih-prd-remote-opinion-radar-worker-config
            - secretRef:
                name: ih-prd-remote-opinion-radar-worker-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
        - name: bootstrap-data
          image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-opinion-radar-srvapp:latest
          imagePullPolicy: Always
          workingDir: /app/worker
          command: [/usr/bin/tini, --, /opt/worker/bin/python, /app/deploy/runtime.py, worker]
          args: [/opt/worker/bin/python, -m, jobs.bootstrap]
          env:
            - name: PATH
              value: /opt/worker/bin:/opt/srvapp/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
          envFrom:
            - configMapRef:
                name: ih-prd-remote-opinion-radar-worker-config
            - secretRef:
                name: ih-prd-remote-opinion-radar-worker-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      containers:
        - name: worker
          image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-opinion-radar-srvapp:latest
          imagePullPolicy: Always
          workingDir: /app/worker
          command: [/usr/bin/tini, --, /opt/worker/bin/python, /app/deploy/runtime.py, worker]
          args: [/opt/worker/bin/python, /app/worker/scheduler.py]
          env:
            - name: PATH
              value: /opt/worker/bin:/opt/srvapp/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
          envFrom:
            - configMapRef:
                name: ih-prd-remote-opinion-radar-worker-config
            - secretRef:
                name: ih-prd-remote-opinion-radar-worker-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
            - name: reports
              mountPath: /app/.scratch
          startupProbe:
            exec:
              command: [/opt/worker/bin/python, /app/deploy/runtime.py, --healthcheck, worker]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/opt/worker/bin/python, /app/deploy/runtime.py, --healthcheck, worker-ready]
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [/opt/worker/bin/python, /app/deploy/runtime.py, --healthcheck, worker]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: home
          emptyDir:
            sizeLimit: 512Mi
        - name: reports
          emptyDir:
            sizeLimit: 512Mi
