apiVersion: v1
kind: Service
metadata:
  name: futuradar-srvapp
  namespace: futu-radar
  labels:
    app: prd-futuradar
    component: srvapp
    env: prd
spec:
  type: ClusterIP
  selector:
    app: prd-futuradar
    component: srvapp
  ports:
    - name: http
      port: 8008
      targetPort: http
      protocol: TCP