# Alembic config for the slim DB. See migrations/README.md for the rationale.
#
#   alembic -c radar_db/alembic.ini current
#   alembic -c radar_db/alembic.ini upgrade head
#
# ASCII only, deliberately: configparser reads this file with the platform
# default codec, which is gbk on a zh-CN Windows box -- any non-ASCII byte here
# makes the alembic CLI itself die with a UnicodeDecodeError. Prose goes in
# migrations/README.md, which is read as UTF-8.
#
# sqlalchemy.url is deliberately absent: env.py takes it from radar_db.db_url(),
# the same function backend/ and worker/ use at runtime. Hardcoding it here
# would let migrations run against a different database than the one the
# services read, and would put the production MySQL password in git.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
