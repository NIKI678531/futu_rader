name: futuradar-prd
services:
  srvapp:
    image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-opinion-radar-srvapp:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.prd
        required: false
        format: raw
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777,size=1g
      - /home/app:mode=1777,size=256m
    ports:
      - 127.0.0.1:18008:8008
    stop_grace_period: 60s
    restart: unless-stopped
  worker:
    image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-opinion-radar-srvapp:latest
    platform: linux/amd64
    working_dir: /app/worker
    entrypoint: [/usr/bin/tini, --, /opt/worker/bin/python, /app/deploy/runtime.py, worker]
    command: [/opt/worker/bin/python, /app/worker/scheduler.py]
    environment:
      PATH: /opt/worker/bin:/opt/srvapp/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    healthcheck:
      test: [CMD, /opt/worker/bin/python, /app/deploy/runtime.py, --healthcheck, worker]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    env_file:
      - path: .env.prd
        required: false
        format: raw
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777,size=1g
      - /home/app:mode=1777,size=512m
      - /app/.scratch:mode=1777,size=512m
    stop_grace_period: 900s
    restart: unless-stopped
  webapp:
    image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-opinion-radar-webapp:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BASE_PATH: /remote/opinion-radar/
        VITE_API_BASE: /remote/opinion-radar/api/v1
    environment:
      API_UPSTREAM: srvapp:8008
    depends_on:
      srvapp:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777,size=128m
      - /etc/nginx/conf.d:mode=1777,size=1m
    ports:
      - 127.0.0.1:18080:8080
    restart: unless-stopped